# FastAPI Prod Compose
version: "3.8"

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://api:8000
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    depends_on:
      - api
    restart: always

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Prod overrides
      ENV: production
      DEBUG: "true"
      DATABASE_URL: postgresql://postgres:postgres@db:5432/zroky
      # Secrets (In real prod, inject via platform secrets)
      SECRET_KEY: ${SECRET_KEY}
      OAUTH_ENCRYPTION_KEY: ${OAUTH_ENCRYPTION_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      # Google OAuth
      GOOGLE_CLIENT_ID: "592661553992-ski8fv40824emc43hudmvkj4g93jt1dv.apps.googleusercontent.com"
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: "http://zroky.com:8000/oauth/google/callback"
      MICROSOFT_REDIRECT_URI: "http://zroky.com:8000/oauth/microsoft/callback"
      # External URLs
      FRONTEND_BASE_URL: http://zroky.com:3000
      PUBLIC_APP_URL: http://zroky.com:3000
    depends_on:
      - db
      - redis

  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zroky
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
