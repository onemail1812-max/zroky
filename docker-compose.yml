version: '3.8'

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    restart: always
    ports:
      - 3000:3000
    depends_on:
      - api
    environment:
      - NODE_ENV=production
      - API_URL=http://api:8000
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
    networks:
      - aaliyah-net

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: always
    ports:
      - 8000:8000
    environment:
      - DATABASE_URL=sqlite:///./zroky.db
      - SECRET_KEY=${SECRET_KEY:-changeme_in_dev}
    volumes:
      - ./data:/app/data
      - ./zroky.db:/app/zroky.db
    networks:
      - aaliyah-net

networks:
  aaliyah-net:
    driver: bridge
