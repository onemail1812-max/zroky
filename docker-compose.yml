version: '3.8'

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
    restart: always
    ports:
      - 3000:3000
    depends_on:
      - api
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - API_URL=http://api:8000
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web.rule=Host(`zroky.com`)"
      - "traefik.http.routers.web.entrypoints=websecure"
      - "traefik.http.routers.web.tls.certresolver=letsencrypt"
      - "traefik.http.services.web.loadbalancer.server.port=3000"
    networks:
      - aaliyah-net
      - default

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: always
    ports:
      - 8000:8000
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./zroky.db
    volumes:
      - ./data:/app/data
      - ./zroky.db:/app/zroky.db
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`zroky.com`) && PathPrefix(`/api/v1`, `/aaliyah`, `/assist`, `/oauth`, `/health`, `/me`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.tls.certresolver=letsencrypt"
      - "traefik.http.services.api.loadbalancer.server.port=8000"
    networks:
      - aaliyah-net
      - default

networks:
  aaliyah-net:
    driver: bridge
  default:
    external: true
    name: zroky_default
